name: migrar

on:
  push:
    branches: [main]
    paths: ['migrations/**']

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Aplica as migrações no D1 remoto
        run: npx --yes wrangler d1 migrations apply oauth-sessions-luis_prates_dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Bônus (0,5): resume as migrações aplicadas com actions/ai-inference e
      # escreve o texto no resumo da execução ($GITHUB_STEP_SUMMARY).
      # O continue-on-error evita que uma falha da IA derrube a aplicação das
      # migrações, que é o que a Tarefa 4 realmente exige.
      - name: Monta o prompt do resumo
        run: |
          BASE="${{ github.event.before }}"
          {
            echo "Resuma, em português e em até 5 tópicos, as migrações D1 aplicadas agora."
            echo "Explique o que cada uma muda no banco e o risco de aplicá-las de novo."
            echo '```diff'
            if git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
              git diff "$BASE" HEAD -- migrations/ | head -c 20000
            else
              git show HEAD -- migrations/ | head -c 20000
            fi
            echo '```'
          } > resumo.txt
          cat resumo.txt

      - id: resumo
        name: Resumo das migrações por IA
        uses: actions/ai-inference@v1
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: resumo.txt
          system-prompt: Você resume migrações de banco de dados em português, de forma curta e objetiva.

      - name: Publica o resumo na execução
        run: |
          echo "## Migrações D1 aplicadas nesta execução" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "${{ steps.resumo.outputs.response-file }}" ]; then
            cat "${{ steps.resumo.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Resumo por IA indisponível nesta execução." >> "$GITHUB_STEP_SUMMARY"
          fi
