name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

# Permissões mínimas: o GITHUB_TOKEN padrão pode ser largo demais.
# contents: read -> ler o repositório para montar o diff
#
# Tarefa 3, item 3: este commit REMOVE "pull-requests: write" de propósito
# para registrar o erro "Resource not accessible by integration" no passo
# "Comenta no PR". O commit seguinte restaura a permissão.
permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install -g @github/copilot

      - name: Monta o prompt
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            git diff origin/${{ github.base_ref }}...HEAD | head -c 20000
            echo '```'
          } > prompt.txt

      - id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "${{ steps.ia.outputs.response-file }}"
