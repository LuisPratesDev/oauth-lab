name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    # PRs de forks não devem receber segredos de autenticação.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Obter código do PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar o GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Preparar diff e instruções da revisão
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > alteracoes.diff
          {
            echo "Analise apenas o diff deste Pull Request de um site OAuth em Cloudflare Pages, Functions e D1."
            echo "Procure primeiro SQL Injection e variáveis interpoladas dentro do texto de consultas SQL."
            echo "Procure também segredos expostos, problemas de autorização e erros de lógica."
            echo "Explique em português, com arquivo, motivo e sugestão objetiva. Não invente problemas."
            echo "Informe quando um achado não for explorável no fluxo atual."
            echo '```diff'
            head -c 20000 alteracoes.diff
            echo
            echo '```'
          } > prompt.txt

      - name: Executar a revisão por IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          model: ''
          system-prompt: 'Você é um revisor de código objetivo e cuidadoso.'

      - name: Comentar a análise no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPOSTA: ${{ steps.ia.outputs.response-file }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RESPOSTA"
