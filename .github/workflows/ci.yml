name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Conferir possíveis segredos versionados
        shell: bash
        run: |
          # Detecta padrões conhecidos sem imprimir os valores encontrados.
          if git grep -qE "GOCSPX[-]|github_pat_[A-Za-z0-9_]+|client_secret[[:space:]]*=[[:space:]]*['\"][^'\"]+" -- . ':!*.md'; then
            echo "::error::Há um possível segredo versionado. Revise os arquivos antes de prosseguir."
            exit 1
          fi

      - name: Verificar as migrações em SQLite local
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          arquivos=(migrations/*.sql)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "::error::Nenhuma migração .sql encontrada"
            exit 1
          fi
          rm -f teste-ci.db
          for arquivo in "${arquivos[@]}"; do
            echo "Aplicando $arquivo"
            sqlite3 teste-ci.db < "$arquivo"
          done
          sqlite3 teste-ci.db '.tables'
          rm -f teste-ci.db

      - name: Verificar o HTML do site
        run: npx --yes htmlhint "public/**/*.html"
